name: Yodle
description: 'Yodle was a New York-based local online marketing and lead-generation company for small
  and medium-sized businesses, offering all-in-one advertising, web presence, and business-automation
  products such as Marketing Essentials, Yodle Ads, and Lighthouse 360. Backed by Bessemer Venture
  Partners, it was acquired by Web.com in February 2016 for roughly $342 million and no longer operates
  as a standalone brand — its technology was folded into Web.com, now part of Newfold Digital. Yodle
  exposes no public developer API, developer portal, or SDKs; api.yodle.com is an internal, auth-gated
  endpoint (HTTP 401) and the legacy www.yodle.com site is effectively defunct.'
